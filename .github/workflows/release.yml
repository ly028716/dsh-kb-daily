name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.2.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run config:parse
      - run: pnpm run verify
      - run: pnpm run release:check -- "$GITHUB_REF_NAME"
      - run: pnpm pack --pack-destination artifacts
      - run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
